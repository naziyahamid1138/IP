<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Centella Beauty - Weather Dashboard</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eef7ee;
            color: #294936;
        }

        /* HEADER */

        header {
            background: linear-gradient(
                135deg,
                #315c42,
                #79a878
            );

            color: white;
            text-align: center;
            padding: 40px 20px;
        }

        header h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        header p {
            font-size: 17px;
        }

        /* CONTAINER */

        .container {
            width: 90%;
            max-width: 650px;
            margin: 40px auto;
        }

        .weather-box {
            background: white;
            padding: 30px;
            border-radius: 18px;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .weather-box h2 {
            text-align: center;
            color: #315c42;
            margin-bottom: 25px;
        }

        /* INPUT */

        .input-area {
            display: flex;
            gap: 10px;
        }

        #cityInput {
            flex: 1;

            padding: 13px;

            border: 2px solid #c9ddca;
            border-radius: 8px;

            font-size: 16px;
            outline: none;
        }

        #cityInput:focus {
            border-color: #6d9b6d;
        }

        #searchButton {
            padding: 13px 20px;

            border: none;
            border-radius: 8px;

            background: #315c42;
            color: white;

            cursor: pointer;
            font-size: 15px;
        }

        #searchButton:hover {
            background: #23452f;
        }

        /* LOADING */

        #loading {
            display: none;

            text-align: center;
            color: #315c42;

            padding: 25px;
        }

        /* ERROR */

        #error {
            display: none;

            background: #f8dddd;
            color: #a33a3a;

            padding: 15px;
            border-radius: 8px;

            text-align: center;
            margin-top: 20px;
        }

        /* WEATHER RESULT */

        #weatherResult {
            display: none;

            margin-top: 25px;
            padding: 25px;

            background: #f3f8f1;
            border-radius: 12px;

            text-align: center;
        }

        #weatherResult h3 {
            color: #315c42;
            font-size: 25px;
            margin-bottom: 15px;
        }

        .weather-icon {
            font-size: 55px;
            margin-bottom: 10px;
        }

        .temperature {
            font-size: 38px;
            font-weight: bold;
            color: #315c42;
            margin: 10px 0;
        }

        .weather-info {
            margin: 10px 0;
            color: #536558;
        }

        .weather-info strong {
            color: #294936;
        }

        /* FOOTER */

        footer {
            background: #315c42;
            color: white;

            text-align: center;
            padding: 20px;

            margin-top: 50px;
        }

        /* MOBILE */

        @media (max-width: 500px) {

            .input-area {
                flex-direction: column;
            }

            #searchButton {
                width: 100%;
            }

        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <header>

        <h1>🌿 Centella Beauty</h1>

        <p>
            Natural Care • Real Beauty
        </p>

    </header>



    <!-- MAIN -->

    <div class="container">

        <div class="weather-box">

            <h2>☀️ Weather Dashboard</h2>


            <!-- INPUT -->

            <div class="input-area">

                <input
                    type="text"
                    id="cityInput"
                    placeholder="Enter city name..."
                >

                <button id="searchButton">
                    Search
                </button>

            </div>


            <!-- LOADING -->

            <div id="loading">
                Loading weather...
            </div>


            <!-- ERROR -->

            <div id="error"></div>


            <!-- WEATHER RESULT -->

            <div id="weatherResult">

                <div class="weather-icon"
                     id="weatherIcon">
                </div>

                <h3 id="cityName"></h3>

                <div class="temperature"
                     id="temperature">
                </div>

                <div class="weather-info"
                     id="weatherDescription">
                </div>

                <div class="weather-info">
                    <strong>Wind Speed:</strong>
                    <span id="windSpeed"></span>
                    km/h
                </div>

                <div class="weather-info">
                    <strong>Coordinates:</strong>
                    <span id="coordinates"></span>
                </div>

            </div>

        </div>

    </div>



    <!-- FOOTER -->

    <footer>

        <p>
            © 2026 Centella Beauty
        </p>

    </footer>



    <!-- JAVASCRIPT -->

    <script>


        // =====================================
        // 1. DOM SELECTION
        // =====================================

        const cityInput =
            document.getElementById("cityInput");

        const searchButton =
            document.getElementById("searchButton");

        const loading =
            document.getElementById("loading");

        const errorMessage =
            document.getElementById("error");

        const weatherResult =
            document.getElementById("weatherResult");

        const cityName =
            document.getElementById("cityName");

        const temperature =
            document.getElementById("temperature");

        const weatherDescription =
            document.getElementById("weatherDescription");

        const windSpeed =
            document.getElementById("windSpeed");

        const coordinates =
            document.getElementById("coordinates");

        const weatherIcon =
            document.getElementById("weatherIcon");



        // =====================================
        // 2. WEATHER CODE FUNCTION
        // =====================================

        function getWeatherDescription(code) {

            if (code === 0) {
                return "Clear sky ☀️";
            }

            else if (code <= 3) {
                return "Partly cloudy 🌤️";
            }

            else if (code <= 48) {
                return "Foggy 🌫️";
            }

            else if (code <= 67) {
                return "Rainy 🌧️";
            }

            else if (code <= 77) {
                return "Snowy ❄️";
            }

            else if (code <= 82) {
                return "Rain showers 🌦️";
            }

            else {
                return "Thunderstorm ⛈️";
            }

        }



        // =====================================
        // 3. WEATHER ICON FUNCTION
        // =====================================

        function getWeatherIcon(code) {

            if (code === 0) {
                return "☀️";
            }

            else if (code <= 3) {
                return "🌤️";
            }

            else if (code <= 48) {
                return "🌫️";
            }

            else if (code <= 67) {
                return "🌧️";
            }

            else if (code <= 77) {
                return "❄️";
            }

            else if (code <= 82) {
                return "🌦️";
            }

            else {
                return "⛈️";
            }

        }



        // =====================================
        // 4. ASYNC FUNCTION
        // =====================================

        async function getWeather() {


            // =================================
            // Get city name
            // =================================

            const city =
                cityInput.value.trim();


            // =================================
            // Empty input validation
            // =================================

            if (city === "") {

                errorMessage.textContent =
                    "Please enter a city name.";

                errorMessage.style.display = "block";

                return;

            }


            // =================================
            // Show loading
            // =================================

            loading.style.display = "block";

            errorMessage.style.display = "none";

            weatherResult.style.display = "none";


            try {


                // =================================
                // 5. FETCH GEOCODING API
                // =================================

                const locationResponse =
                    await fetch(
                        "https://geocoding-api.open-meteo.com/v1/search?name="
                        + encodeURIComponent(city)
                        + "&count=1&language=en&format=json"
                    );


                // =================================
                // Convert to JSON
                // =================================

                const locationData =
                    await locationResponse.json();


                // =================================
                // Check city found
                // =================================

                if (
                    !locationData.results ||
                    locationData.results.length === 0
                ) {

                    throw new Error(
                        "City not found."
                    );

                }


                // =================================
                // Get location data
                // =================================

                const location =
                    locationData.results[0];


                const latitude =
                    location.latitude;


                const longitude =
                    location.longitude;


                const foundCity =
                    location.name;


                // =================================
                // 6. FETCH WEATHER API
                // =================================

                const weatherResponse =
                    await fetch(
                        "https://api.open-meteo.com/v1/forecast"
                        + "?latitude=" + latitude
                        + "&longitude=" + longitude
                        + "&current=temperature_2m,wind_speed_10m,weather_code"
                    );


                // =================================
                // Convert weather response to JSON
                // =================================

                const weatherData =
                    await weatherResponse.json();


                // =================================
                // Get current weather
                // =================================

                const current =
                    weatherData.current;


                // =================================
                // 7. DOM MANIPULATION
                // =================================

                cityName.textContent =
                    foundCity;


                temperature.textContent =
                    current.temperature_2m
                    + "°C";


                weatherDescription.textContent =
                    getWeatherDescription(
                        current.weather_code
                    );


                windSpeed.textContent =
                    current.wind_speed_10m;


                coordinates.textContent =
                    latitude + ", " + longitude;


                weatherIcon.textContent =
                    getWeatherIcon(
                        current.weather_code
                    );


                // =================================
                // Show result
                // =================================

                loading.style.display = "none";

                weatherResult.style.display = "block";

            }


            // =====================================
            // 8. ERROR HANDLING
            // =====================================

            catch (error) {

                loading.style.display = "none";

                errorMessage.style.display = "block";

                errorMessage.textContent =
                    "Error: " + error.message;

            }

        }



        // =====================================
        // 9. BUTTON EVENT
        // =====================================

        searchButton.addEventListener(
            "click",
            getWeather
        );



        // =====================================
        // 10. ENTER KEY EVENT
        // =====================================

        cityInput.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    getWeather();

                }

            }
        );


    </script>


</body>

</html>
