<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex-flow</title>
</head>
<style>
    *{
        margin: 0;
        padding: 20px;
        background-color: lightgray;
    }
    .flexbox{
        margin: 2px;
        border: 5px solid black;
        display : flex;
        padding: 10px;
        
        flex-flow: row wrap;
    }
    .item1{
        background-color: red;
       text-align: center;
       padding: 20px;
       border: 2px solid white;
    }
    .item2{
        background-color: blue;
        text-align: center;
        padding: 20px;
        border: 2px solid white;    
    }
    .item3{
        background-color: green;
        text-align: center;
        padding: 20px;
        border: 2px solid white;
    }
    .item4{
        background-color: yellow;
        text-align: center;
        padding: 20px;
        border: 2px solid white;
    }
    .item5{
        background-color: red;
       text-align: center;
       padding:20px;
       border: 2px solid white;
    }
    .item6{
        background-color: blue;
        text-align: center;
        padding:20px;
        border: 2px solid white;    
    }
    .item7{
        background-color: green;
        text-align: center;
        padding:20px;
        border: 2px solid white;
    }
    .item8{
        background-color: yellow;
        text-align: center;
        padding:20px;
        border: 2px solid white;
    }
    .flexbox1{
        margin: 0;
        border: 5px solid black;
        display : flex;
        height: 300px;
        padding: 10px;
        flex-flow: row wrap-reverse;
    }
    .flexbox2{
        margin: 0;
        border: 5px solid black;
        display : flex;
        height: 300px;
        padding: 10px;
        flex-flow: column wrap;
    }
    .flexbox3{
        margin: 0;
        border: 5px solid black;
        display : flex;
        height: 300px;
        padding: 10px;
        flex-flow: column wrap-reverse;
    }   
</style>
<body>
    <div class="flexbox">
        <div class="item1">first</div>
        <div class="item2">second</div>
        <div class="item3">third</div>
        <div class="item4">fourth</div>
        <div class="item5">fifth</div>
        <div class="item6">sixth</div>
        <div class="item7">seventh</div>
        <div class="item8">eighth</div>
    </div>
    <div class="flexbox1">
        <div class="item1">first</div>
        <div class="item2">second</div>
        <div class="item3">third</div>
        <div class="item4">fourth</div>
        <div class="item5">fifth</div>
        <div class="item6">sixth</div>
        <div class="item7">seventh</div>
        <div class="item8">eighth</div>
    </div>
    <div class="flexbox2">
        <div class="item1">first</div>
        <div class="item2">second</div>
        <div class="item3">third</div>
        <div class="item4">fourth</div>
        <div class="item5">fifth</div>
        <div class="item6">sixth</div>
        <div class="item7">seventh</div>
        <div class="item8">eighth</div>
    </div>
    <div class="flexbox3">
        <div class="item1">first</div>
        <div class="item2">second</div>
        <div class="item3">third</div>
        <div class="item4">fourth</div>
        <div class="item5">fifth</div>
        <div class="item6">sixth</div>
        <div class="item7">seventh</div>
        <div class="item8">eighth</div>
    </div>  
    
</body>
</html>
