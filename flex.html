<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gridflex</title>
</head>
<style>
    *{
        margin: 0;
        padding: 20px;
        background-color: lightgray;
    }
    .flexbox{
        display : flex;
        padding: 10px;
        background-color: black;
    }
    
.flexbox1{
display : flex;
padding: 10px;
background-color: black;
flex-direction:row-reverse;
}
.item1{
    background-color: red;
   text-align: center;
   padding:15px;
   border: 2px solid white;
}
.item2{
    background-color: blue;
    text-align: center;
    padding:15px;
    border: 2px solid white;    
}
.item3{
    background-color: green;
    text-align: center;
    padding:15px;
    border: 2px solid white;
}
.item4{
    background-color: yellow;
    text-align: center;
    padding:15px;
    border: 2px solid white;
}
.flexbox2{
display : flex;
padding: 10px;
background-color: lightgray;    
flex-direction: column;
}
.item5{
    background-color: red;
   text-align: center;
   padding:15px;
   border: 2px solid white;
}
.item6{
    background-color: blue;
    text-align: center;
    padding:15px;
    border: 2px solid white;    
}
.item7{
    background-color: green;
    text-align: center;
    padding:15px;
    border: 2px solid white;
}
.item8{
    background-color: yellow;
    text-align: center;
    padding:15px;
    border: 2px solid white;
} 
.flexbox3{
display : flex;
padding: 10px;
background-color: lightgray;
flex-direction: column-reverse;
}        
</style>

<body>
    <h1>Flex-direction=row</h1>
    <div class="flexbox">
        <h1>headings</h1>
        <div class="item1">first</div>
        <div class = "item2">second</div>
        <div class = "item3">third</div>
        <div class = "item4">fourth</div>
    </div>
    <h1>Flex-direction=row-reverse</h1>
    <div class= "flexbox1">
        <h1>headings</h1>
        <div class="item1">fifth</div>
        <div class = "item2">sixth</div>
        <div class = "item3">seventh</div>
        <div class = "item4">eighth</div>
    </div>
    <h1>Flex-direction=column</h1>
    <div class= "flexbox2">
        <h1>headings</h1>
        <div class="item5">9th</div>
        <div class = "item6">10th</div>
        <div class = "item7">11th</div>
        <div class = "item8">12th</div>
        </div>
        <h1>flex direction = column-reverse</h1>
        <div class="flexbox3">
        <h1>headings</h1>
        <div class="item5">13th</div>
        <div class = "item6">14th</div>
        <div class = "item7">15th</div>
        <div class = "item8">16th</div>
    </div>
</body>
</html>
