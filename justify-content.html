<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Justify- content properties</title>
</head>
<style>
    *{
        margin: 0;
        padding: 10px;
        background-color: lightgray;
    }
    .item1{
        background-color: red;
       text-align: center;
       padding: 20px;
       border: 2px solid white;
    }
    .item2{
        background-color: blue;
        text-align: center;
        padding: 20px;
        border: 2px solid white;    
    }
    .item3{
        background-color: green;
        text-align: center;
        padding: 20px;
        border: 2px solid white;
    }
    .item4{
        background-color: yellow;
        text-align: center;
        padding: 20px;
        border: 2px solid white;
    }
    .flexbox{
        margin: 2px;
        border: 5px solid black;
        display : flex;
        padding: 10px;
        justify-content: flex-start;
    }
    .flexbox1{
        margin: 2px;
        border: 5px solid black;
        display : flex;
        padding : 10px;
        justify-content: center;
    }
    .flexbox2{
        margin:2px;
        border:5px solid black;
        display : flex;
        padding:10px;
        justify-content: flex-end;
    }
    .flexbox3{
        margin :2px;
        
        border :5px solid black;
        display:flex;
        justify-content:space-between;
        
    }
   

</style>
<body>
    <h2>Flex Start</h2>
    <div class="flexbox">
        <div class="item1">first</div>
        <div class="item2">second</div>
        <div class="item3">third</div>
        <div class="item4">fourth</div>
    </div>  
    <h2>Center</h2>
    <div class="flexbox1">
        <div class="item1">first</div>
        <div class="item2">second</div>
        <div class="item3">third</div>
        <div class="item4">fourth</div>
    </div>
    <h2>Flex End</h2>
    <div class="flexbox2">
        <div class="item1">first</div>
        <div class="item2">second</div>
        <div class="item3">third</div>
        <div class="item4">fourth</div>
    </div>
    <h2>Space Between</h2>
    <div class ="flexbox3">
        
        <div class ="item1">1st</div>
        <div class ="item2">2nd</div>
        <div class ="item3">3rd</div>
        <div class = "item4">4th</div>
        
    </div>



    
</body>
</html>
